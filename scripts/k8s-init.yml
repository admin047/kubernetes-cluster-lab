---
- name: Kubernetes node initialization
  hosts: k8s_nodes
  become: yes

  tasks:

    # 关闭swap
    - name: Disable swap
      command: swapoff -a


    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '#\1'


    # 加载内核模块
    - name: Load kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter


    - name: Load modules immediately
      shell: |
        modprobe overlay
        modprobe br_netfilter


    # Kubernetes网络参数
    - name: Configure sysctl for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1


    - name: Apply sysctl
      command:
        sysctl --system


    # 安装基础工具
    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
        state: present
        update_cache: yes


    # 重启containerd
    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes


    # 检查服务
    - name: Check kubelet
      systemd:
        name: kubelet
      register: kubelet_status


    - name: Show kubelet status
      debug:
        msg: "{{ kubelet_status.status.ActiveState }}"
