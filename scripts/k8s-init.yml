---
- name: Kubernetes node initialization
  hosts: k8s_nodes
  become: yes

  tasks:
    - name: Disable swap
      command: swapoff -a

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '#\1'

    - name: Ensure /etc/modules-load.d exists
      file:
        path: /etc/modules-load.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Load kernel modules file
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: '0644'

    - name: Load modules immediately
      shell: |
        modprobe overlay || true
        modprobe br_netfilter || true
      args:
        warn: false

    - name: Configure sysctl for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: '0644'

    - name: Apply sysctl
      command: sysctl --system

    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
        state: present
        update_cache: yes

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes
      ignore_errors: yes

    - name: Check kubelet
      systemd:
        name: kubelet
      register: kubelet_status
      ignore_errors: yes

    - name: Show kubelet status
      debug:
        msg: "{{ kubelet_status.status.ActiveState | default('unknown') }}"
