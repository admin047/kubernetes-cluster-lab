# postgresql-primary.conf (示例)
# 放置路径：configs/postgresql/postgresql-primary.conf
# 调整 pg_version 和参数以匹配你的系统

# PostgreSQL 主节点示例配置片段
wal_level = 'replica'
max_wal_senders = 5
wal_keep_segments = 64
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archived/%f && cp %p /var/lib/postgresql/archived/%f'
